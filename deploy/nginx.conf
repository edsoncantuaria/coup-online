server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos que apontam para a versão atual: sempre revalidar, para um
  # deploy novo chegar sem o jogador precisar limpar o cache.
  location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }
}
